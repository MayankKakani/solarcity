# Solarplan Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "solarplan.fullname" . }}-solarplan
  labels:
    {{- include "solarplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: solarplan
spec:
  type: {{ .Values.solarplan.service.type }}
  ports:
    - port: {{ .Values.solarplan.service.port }}
      targetPort: solarplan
      protocol: TCP
      name: http
  selector:
    {{- include "solarplan.selectorLabels" . | nindent 4 }}

{{- if .Values.postgresql.enabled }}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "solarplan.fullname" . }}-postgresql
  labels:
    {{- include "solarplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "solarplan.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
